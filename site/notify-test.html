<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>알림 시험</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:'Malgun Gothic',sans-serif;max-width:560px;margin:60px auto;padding:0 20px;color:#1d2433}button{font-size:18px;padding:14px 22px;border-radius:10px;border:0;background:#1d2433;color:#fff;cursor:pointer}#st{margin-top:22px;font-size:15px;line-height:1.7;background:#f3f5f9;border-radius:10px;padding:14px}</style></head>
<body><h2>회사 업무 사이트 알림 시험</h2><p>아래 버튼을 누르고, 브라우저가 알림을 물어보면 <b>허용</b>을 눌러 주세요. 3초 뒤 [A], 8초 뒤 [B] 알림이 화면 오른쪽 아래에 떠요.</p>
<button id="go">알림 시험하기</button><div id="st">아직 누르지 않았어요.</div>
<script>
const st=document.getElementById('st'); const log=t=>st.innerHTML+='<br>'+t;
document.getElementById('go').onclick=async()=>{ st.innerHTML='알림 권한 지금 상태: <b>'+Notification.permission+'</b>';
 const p=await Notification.requestPermission(); log('허용 결과: <b>'+p+'</b>'); if(p!=='granted'){ log('허용이 안 돼서 알림을 띄울 수 없어요. 주소창 왼쪽 아이콘 → 알림 → 허용으로 바꾼 뒤 다시 눌러 주세요.'); return; }
 let reg=null; try{ reg=await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; log('알림 담당 연결: 됨'); }catch(e){ log('알림 담당 연결 실패: '+e.message); }
 setTimeout(()=>{ try{ new Notification('[A] 대표님 지시가 왔어요',{body:'[시험] VIGOR 상세페이지 3번 사진 교체 · 기한 10/30(금)',icon:'/icon-512.png'}); log('[A] 보냄 '+new Date().toLocaleTimeString()); }catch(e){ log('[A] 실패: '+e.message); } },3000);
 setTimeout(async()=>{ try{ await reg.showNotification('[B] 대표님 지시가 왔어요',{body:'[시험] 사이트 탭이 닫혀 있어도 오는 방식',icon:'/icon-512.png',tag:'t'+Date.now()}); log('[B] 보냄 '+new Date().toLocaleTimeString()); }catch(e){ log('[B] 실패: '+e.message); } },8000);
};
</script></body></html>
