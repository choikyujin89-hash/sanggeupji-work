<script>

const SB_URL='https://rccqttalxsniltuxwbyt.supabase.co';
const SB_KEY='sb_publishable_SylrJrFPnG4TIVxqUVB-jQ_jCIJYmcD';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  if(!session){ showOnly('login'); return; }

const KWTYPE=t=>{t=String(t||''); if(/^메인/.test(t)) return '메인'; if(/같은 결핍/.test(t)) return '같은 고민'; if(/같은 원리/.test(t)) return '같은 해결 방법'; return t;};

const srcPick=L=>L.find(x=>x.link&&x.source_type==='위탁')||L.find(x=>x.link)||null;
const siteName=x=>{ let n=String(x.site_vendor||'').split(/\s+-\s+|,|·|\//)[0].replace(/\s*\([^)]*\)\s*$/,'').replace(/^\(주\)\s*|^주식회사\s*|\s*주식회사$/,'').trim(); if(!n) n=String(x.source_type||'링크'); return n.length>10?n.slice(0,10)+'…':n; };
const outA=(url,label,style,title)=>'<a class="out" href="'+esc(url)+'" target="_blank" rel="noopener"'+(title?' title="'+esc(title)+'"':'')+' style="'+(style||'')+'">'+label+'</a>';

async function viewPool(){

   +'<h3>메인 키워드 <span class="sub">점수 = 찾는 사람·살 마음·빈틈·넓힐 여지 · <b style="color:#03c75a">N↗</b>과 빈틈 키워드를 누르면 네이버 검색 · 빈틈 키워드에 마우스를 올리면 전체가 보여요</span></h3>'
   +'<table><tr><th>메인 키워드</th><th>점수</th><th title="빈틈 키워드들의 월 검색량을 더한 값">빈틈 검색량</th><th style="min-width:260px">빈틈 키워드 (검색량 순)</th><th>R 후보</th><th>점수 1위 R 후보</th><th>내 검토</th></tr>'

async function promote(it,s,srcs){
  if(!confirm('"'+it.r_name+'"\n\n이 R을 준비 시작할까요? R 목록의 "준비 중"으로 넘어가요.')) return;
  const kw=[s.main_keyword,it.main_keyword_gap,it.co_ad_keywords].filter(Boolean).join(', ');
  const src=srcs.filter(x=>x.r_name===it.r_name); const link=(src.find(x=>x.link)||{}).link||'';
  const memo=['타겟: '+(it.target_situation||''),'납득 이유: '+(it.convincing_reason||''),'차별화: '+(it.differentiation||''),'소싱처 '+src.length+'곳 (키워드별 R 후보 › '+POOL.run+' › '+s.main_keyword+')'].join('\n');
  const {data,error}=await sb.from('r_products').insert({name:it.r_name,problem:it.pain_point||'',status:'준비 중',stage:'시장조사',judgment:'진행',found_channel:'파워컨텐츠',owner:ME.name,keywords:kw,source_link:link,memo,next_action:'시장조사: 키워드 빈틈·경쟁 가격대 확인',created_by:ME.name,updated_at:new Date().toISOString()}).select('id').single();
  if(error){ if(await expired(error)) return; toast('넘기지 못했어요: '+error.message); return; }
  await sb.from('rs_items').update({status:'준비 시작',promoted_r_id:data.id,promoted_at:new Date().toISOString()}).eq('id',it.id);
  toast('R 목록 "준비 중"으로 넘겼어요'); poolDetail();
}

  const ch=(r.channels||'').split(',').map(s=>s.trim()); const opt=(arr,v)=>arr.map(s=>'<option '+(v===s?'selected':'')+'>'+s+'</option>').join('');

function inlineFmt(s){ return esc(s).replace(/\*\*([^*\n][\s\S]*?)\*\*/g,'<b>$1</b>'); }
function textBlock(s){ // "| 칸 | 칸 |" 줄 묶음 → 표, 나머지는 글
  const L=String(s).split('\n'); let out='', buf=[];
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  const flush=()=>{ if(!buf.length) return; const rows=buf.map(l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim())); const n=Math.max(...rows.map(r=>r.length));
    out+='<table class="dtbl"><thead><tr>'+rows[0].map(c=>'<th>'+inlineFmt(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+Array.from({length:n},(_,i)=>'<td>'+inlineFmt(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; buf=[]; };
  L.forEach((l,i)=>{ if(isRow(l)){ buf.push(l); return; } if(buf.length){ flush(); out+=inlineFmt(l)+(i<L.length-1?'\n':''); return; } out+=inlineFmt(l)+(i<L.length-1?'\n':''); });
  flush(); return out; }
function richBody(t,list){ if(!document.getElementById('dtbl-css')){ const st=document.createElement('style'); st.id='dtbl-css'; st.textContent='.dtbl{border-collapse:collapse;width:100%;margin:6px 0 10px;white-space:normal;font-size:13px;background:#fff}.dtbl th,.dtbl td{border:1px solid #e3e6ea;padding:6px 8px;text-align:left;vertical-align:top}.dtbl th{background:#f3f5f8;font-weight:600;white-space:nowrap}.dtbl td:first-child{white-space:nowrap}@media(max-width:600px){.dtbl{display:block;overflow-x:auto}}'; document.head.appendChild(st); } list=Array.isArray(list)?list:[]; const used=new Set(); const parts=String(t||'').split(/(\[사진 \d+(?:\s*\|\s*\d+)?\][^\n]*)/);
  const h=parts.map(s=>{ const m=s.match(/^\[사진 (\d+)(?:\s*\|\s*(\d+))?\](.*)$/); if(m){ const x=list[+m[1]-1]; if(!x) return esc(s); used.add(+m[1]-1); const w=m[2]?'width:'+(+m[2])+'px;':'max-height:520px;'; return '<div style="margin:8px 0"><img data-th-img="'+esc(x.path||x)+'" alt="사진 '+m[1]+'" style="'+w+'max-width:100%;border-radius:8px;border:1px solid #eceef1;background:#f4f5f7">'+(m[3].trim()?'<div class="sub">'+esc(m[3].trim())+'</div>':'')+'</div>'; } return textBlock(s); }).join('');

function bodyToEdHtml(t,list){ list=Array.isArray(list)?list:[]; const used=new Set();
  let h=String(t||'').split(/(\[사진 \d+(?:\s*\|\s*\d+)?\])/).map(s=>{ const m=s.match(/^\[사진 (\d+)(?:\s*\|\s*(\d+))?\]$/); if(m&&list[+m[1]-1]){ used.add(+m[1]-1); const p=list[+m[1]-1].path||list[+m[1]-1]; return '<img class="ed-img" data-th-img="'+esc(p)+'" style="'+(m[2]?'width:'+(+m[2])+'px':'max-height:520px')+'">'; } return inlineFmt(s).replace(/\n/g,'<br>'); }).join('');
  list.forEach((x,i)=>{ if(!used.has(i)) h+='<br><img class="ed-img" data-th-img="'+esc(x.path||x)+'" style="max-height:520px">'; });
  return h; }
function edToBody(root){ let out=''; const imgs=[];
  const nl=()=>{ if(out&&!out.endsWith('\n')) out+='\n'; };
  const walk=(n,bold)=>{ for(const c of n.childNodes){
    if(c.nodeType===3){ out+=c.nodeValue.replace(/\u00a0/g,' '); continue; }
    if(c.nodeType!==1) continue; const tg=c.tagName;
    if(tg==='BR'){ out+='\n'; continue; }
    if(tg==='IMG'){ const p=c.dataset.thImg; if(!p) continue; imgs.push({path:p}); const w=parseInt(c.style.width)||0; out+='[사진 '+imgs.length+(w?' | '+w:'')+']'; continue; }
    if(c.classList&&c.classList.contains('ed-ui')) continue;
    const isB=!bold&&(tg==='B'||tg==='STRONG'||/^(bold|[6-9]00)$/.test(c.style&&c.style.fontWeight||''));
    if(tg==='DIV'||tg==='P'||/^H\d$/.test(tg)||tg==='LI'){ nl(); walk(c,bold); nl(); continue; }
    if(isB){ const before=out.length; out+='**'; walk(c,true); if(out.length===before+2) out=out.slice(0,before); else out+='**'; continue; }
    walk(c,bold); } };
  walk(root,false);
  return {body:out.replace(/\*\*(\s*)\*\*/g,'$1').replace(/\n{3,}/g,'\n\n').replace(/\n+$/,''), images:imgs}; }

}

function refForm(r){

    const res=r?await sb.from('th_posts').update(row).eq('id',r.id):await sb.from('th_posts').insert({...row,status:'래퍼런스',mode:'전환컨텐츠',source:'site',created_time:new Date().toISOString()});
    if(await thOk(res,'저장하지 못했어요')){ thClose(); toast('저장했어요'); viewThRef(); } };
}

function report(kind,who){
  const t=today(); const start=kind==='week'?weekStart(t):t.slice(0,8)+'01'; const inP=x=>x&&x>=start&&x<=t; const by=r=>who==='전체'||mine(r,who);
  const big=WL.filter(r=>r.importance==='높음'&&r.type==='결정'&&inP(r.log_date)&&(who==='전체'||r.who===who||r.uploader===who));
  const doneF=r=>r.people!==false&&((r.type==='한 일'&&inP(r.log_date))||(r.type==='할 일'&&r.status==='완료'&&inP(r.closed_date)));
  const done=WL.filter(r=>doneF(r)&&by(r)), left=WL.filter(r=>isOpenTodo(r)&&by(r)), blk=WL.filter(r=>isBlocked(r)&&by(r)), kn=WL.filter(r=>r.people&&r.type==='노하우'&&inP(r.log_date)&&(who==='전체'||r.who===who));
  const li=(a,f)=>a.length?'<ul>'+a.map(f).join('')+'</ul>':'<div class="none">없음</div>';
  const per=PEOPLE.map(p=>{const n=WL.filter(r=>inP(r.log_date)&&(r.who===p||r.uploader===p)).length;return '<li><b>'+p+'</b>: '+(n?'기록 '+n+' · 끝낸 일 '+WL.filter(r=>doneF(r)&&mine(r,p)).length+' · 막힌 것 '+WL.filter(r=>isBlocked(r)&&mine(r,p)).length:'기록 없음')+'</li>';}).join('');
  return '<div class="box rep" style="margin-top:12px"><div class="sub">'+(kind==='week'?'이번 주':'이번 달')+' ('+start+' ~ '+t+') · '+who+'</div>'
   +'<h3>큰 결정</h3>'+li(big,r=>'<li>'+r.log_date.slice(5)+' '+esc(r.content)+(r.reason?' <span class="sub">— '+esc(r.reason)+'</span>':'')+'</li>')
   +'<h3>끝낸 일</h3>'+li(done,r=>'<li>'+esc(r.content)+' <span class="sub">'+esc(r.owner||r.who||'')+'</span></li>')
   +'<h3>아직 남은 할 일</h3>'+li(left,r=>'<li>'+esc(r.content)+' <span class="sub">'+esc(r.owner||r.who)+' · '+r.log_date.slice(5)+' 생김</span></li>')
   +'<h3>막혀 있는 것</h3>'+li(blk,r=>'<li>'+esc(r.content)+(r.unblock?' <span class="sub">— 풀려면: '+esc(r.unblock)+'</span>':'')+'</li>')
   +'<h3>새 노하우</h3>'+li(kn,r=>'<li>'+esc(r.content)+'</li>')
   +'<h3>사람별 한 줄</h3><ul>'+per+'</ul></div>';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden');});
boot();

</script></body></html>
