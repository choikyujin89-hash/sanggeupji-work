<script>
const AUTH_TYPE=(location.hash.match(/type=(invite|recovery|signup|magiclink)/)||[])[1]||null;
const SB_URL='https://rccqttalxsniltuxwbyt.supabase.co';
const SB_KEY='sb_publishable_SylrJrFPnG4TIVxqUVB-jQ_jCIJYmcD';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const PEOPLE=['대표님','철님','다원님'];
let ME=null, VIEW='home', NEED_PW=false;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function today(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
function nowHM(){return new Date(Date.now()+9*3600e3).toISOString().slice(11,16);}
function weekStart(t){const d=new Date(t+'T00:00:00Z');const wd=(d.getUTCDay()+6)%7;return new Date(d.getTime()-wd*864e5).toISOString().slice(0,10);}
function showOnly(id){['login','setpw','app'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));document.body.classList.toggle('auth',id!=='app');}

/* ---------- 로그인 ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showOnly('login'); return; }
  if(AUTH_TYPE==='invite'||AUTH_TYPE==='recovery'||NEED_PW){ NEED_PW=true; showOnly('setpw'); history.replaceState(null,'',location.pathname); return; }
  const {data:name,error}=await sb.rpc('my_name');
  if(error||!name){ await sb.auth.signOut({scope:'local'}); showOnly('login'); $('#lmsg').textContent=error?'로그인이 풀렸어요. 다시 로그인해 주세요.':'등록되지 않은 계정이에요. 대표님께 문의하세요.'; return; }
  ME={name,email:session.user.email};
  try{ const {data:b}=await sb.rpc('is_boss'); ME.boss=!!b; }catch(e){ ME.boss=false; }
  showOnly('app');
  VIEW=(location.hash||'#home').slice(1)||'home'; if(VIEW.includes('=')) VIEW='home';

}

const siteName=x=>{ let n=String(x.site_vendor||'').split(/\s+-\s+|,|·|\//)[0].replace(/\s*\([^)]*\)\s*$/,'').replace(/^\(주\)\s*|^주식회사\s*|\s*주식회사$/,'').trim(); if(!n) n=String(x.source_type||'링크'); return n.length>10?n.slice(0,10)+'…':n; };
const outA=(url,label,style,title)=>'<a class="out" href="'+esc(url)+'" target="_blank" rel="noopener"'+(title?' title="'+esc(title)+'"':'')+' style="'+(style||'')+'">'+label+'</a>';

async function viewPool(){
  const box=$('#mb'); box.innerHTML='불러오는 중…';
  const {data:runs,error}=await sb.from('rs_summary').select('run_id,employee').order('run_id',{ascending:false}).limit(500);
  if(error){ if(await expired(error)) return; box.textContent='불러오지 못했어요: '+error.message; return; }
  const runIds=[...new Set((runs||[]).map(r=>r.run_id))]; if(!runIds.length){ box.innerHTML='<div class="empty">아직 올라온 결과가 없어요. 철님 R소싱 자동화가 올리면 여기에 나와요.</div>'; return; }
  if(!POOL.run||!runIds.includes(POOL.run)) POOL.run=runIds[0];
  if(POOL.main) return poolDetail();
  const {data:sum}=await sb.from('rs_summary').select('*').eq('run_id',POOL.run).order('main_score',{ascending:false,nullsFirst:false});
  const {data:its}=await sb.from('rs_items').select('main_keyword,status,rank').eq('run_id',POOL.run).lte('rank',100);
  const {data:gks}=await sb.from('rs_keywords').select('main_keyword,keyword,search_volume,gap').eq('run_id',POOL.run).eq('gap','O').order('search_volume',{ascending:false,nullsFirst:false});
  const GK={}; (gks||[]).forEach(k=>{(GK[k.main_keyword]=GK[k.main_keyword]||[]).push(k);});

   +'<div style="display:flex;gap:8px;align-items:center;margin:12px 0 4px;flex-wrap:wrap"><span class="sub">실행</span><select id="p_run" style="width:auto">'+runIds.map(r=>'<option '+(r===POOL.run?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select><span class="sub">· '+esc(emp)+' · 메인 키워드 '+(sum||[]).length+'개 · R 후보 '+(its||[]).length+'개</span></div>'
   +'<h3>메인 키워드 <span class="sub">점수 = 찾는 사람·살 마음·빈틈·넓힐 여지 · <b style="color:#03c75a">N↗</b>과 빈틈 키워드를 누르면 네이버 검색 · 빈틈 키워드에 마우스를 올리면 전체가 보여요</span></h3>'
   +'<table><tr><th>메인 키워드</th><th>점수</th><th title="빈틈 키워드들의 월 검색량을 더한 값">빈틈 검색량</th><th style="min-width:260px">빈틈 키워드 (검색량 순)</th><th>R 후보</th><th>점수 1위 R 후보</th><th>내 검토</th></tr>'
   +(sum||[]).slice(POOL.page*PER,POOL.page*PER+PER).map(s=>{const gk=GK[s.main_keyword]||[];const t=st[s.main_keyword]||{};const n=Object.values(t).reduce((a,b)=>a+b,0);
     return '<tr class="click" data-main="'+esc(s.main_keyword)+'"><td class="nw"><b style="color:#03a04c;text-decoration:underline">'+esc(s.main_keyword)+'</b> '+nvA(s.main_keyword,'N↗',NBTN)+'</td>'

   +(pages>1?'<div style="display:flex;gap:6px;justify-content:center;margin:10px 0">'+Array.from({length:pages},(_,i)=>'<span class="btn'+(i===POOL.page?' rec':'')+'" data-pg="'+i+'" style="cursor:pointer">'+(i*PER+1)+'~'+Math.min((i+1)*PER,(sum||[]).length)+'위</span>').join('')+'</div>':'');

async function promote(it,s,srcs){
  if(!confirm('"'+it.r_name+'"\n\n이 R을 준비 시작할까요? R 목록의 "준비 중"으로 넘어가요.')) return;
  const kw=[s.main_keyword,it.main_keyword_gap,it.co_ad_keywords].filter(Boolean).join(', ');
  const src=srcs.filter(x=>x.r_name===it.r_name); const link=(src.find(x=>x.link)||{}).link||'';
  const memo=['타겟: '+(it.target_situation||''),'납득 이유: '+(it.convincing_reason||''),'차별화: '+(it.differentiation||''),'소싱처 '+src.length+'곳 (키워드별 R 후보 › '+POOL.run+' › '+s.main_keyword+')'].join('\n');
  const {data,error}=await sb.from('r_products').insert({name:it.r_name,problem:it.pain_point||'',status:'준비 중',stage:'시장조사',judgment:'진행',found_channel:'파워컨텐츠',owner:ME.name,keywords:kw,source_link:link,memo,next_action:'시장조사: 키워드 빈틈·경쟁 가격대 확인',created_by:ME.name,updated_at:new Date().toISOString()}).select('id').single();
  if(error){ if(await expired(error)) return; toast('넘기지 못했어요: '+error.message); return; }
  await sb.from('rs_items').update({status:'준비 시작',promoted_r_id:data.id,promoted_at:new Date().toISOString()}).eq('id',it.id);
  toast('R 목록 "준비 중"으로 넘겼어요'); poolDetail();
}

function viewThPay(){ if(!ME.boss){ $('#mb').innerHTML='<div class="empty">대표님 계정에서만 보여요.</div>'; return; } thView(()=>{

    const fee=s.n>=TH_RULE.feeMin?TH_RULE.fee:0, g=s.n*TH_RULE.post+s.c*TH_RULE.cmt+s.b*TH_RULE.blog+fee, t=Math.round(g*TH_RULE.tax); tot.n+=s.n;tot.c+=s.c;tot.b+=s.b;tot.fee+=fee;tot.g+=g;tot.t+=t;tot.net+=g-t;

  h+='<div class="rule">계산: 원고 '+TH_RULE.post+'원 · 댓글형 +'+TH_RULE.cmt+'원 · 블로그형 '+TH_RULE.blog.toLocaleString()+'원(노션에도 추정값) · 정산전 원고 '+TH_RULE.feeMin+'건 이상이면 주관리비 '+TH_RULE.fee.toLocaleString()+'원 · 3.3% 공제. 계좌·주민번호는 이 사이트에 가져오지 않아요. 이체할 때 노션 비공개 표에서 보세요.</div>';

async function loadWI(){ const {data,error}=await sb.from('work_items').select('*').eq('hidden',false).order('last_activity',{ascending:false}).limit(400); if(error) throw error; const cut=Date.now()-7*864e5; WI=(data||[]).filter(w=>!w.done||new Date(w.done_at||w.updated_at).getTime()>cut); }

async function drawWork(who){

      +WIPR.map(p=>'<div class="drow"><span>🔀 <b>사이트 변경 요청 #'+p.number+'</b> · '+esc(p.user&&p.user.login||'')+' · '+esc(p.title)+'</span><span><a class="btn" style="text-decoration:none;color:#333" href="'+esc(p.html_url)+'" target="_blank">열기 (미리보기 댓글)</a></span></div>').join('')
      +asks.map(w=>'<div class="drow"><span>🙋 <b>'+esc(w.owner)+'</b> · '+esc(w.boss_note||w.title)+'</span><span><span class="btn" style="cursor:pointer" data-wi="'+w.id+'" data-act="decided">처리했어요</span></span></div>').join('')+'</div>'; }
  const col=(cls,dot,t,sub,arr,empty)=>'<div><div class="colh"><span class="dot" style="background:'+dot+'"></span>'+t+' <span class="sub">'+arr.length+'</span> <span class="mini">'+sub+'</span></div>'+(arr.map(wiCard).join('')||'<div class="wi '+cls+'" style="color:#999">'+empty+'</div>')+'</div>';
  h+='<div class="wcols">'+col('','#03c75a','진행 중','최근 2시간 안에 대화',run,'지금 진행 중인 일이 없어요')+col('stop','#f0b429','멈춤 · 하다 만 일','2시간 넘게 대화 없음 · 다시 대화하면 진행 중',stop,'멈춘 일이 없어요')+col('done','#c9ced6','완료','7일 보관',done,'최근 끝낸 일이 없어요')+'</div>';
  h+='<div class="wadd"><input id="wi_new" placeholder="AI 밖에서 한 일 추가 (전화·카톡·미팅)  예) 공급처 A 통화, 샘플 11/3 도착 예정"><select id="wi_new_owner">'+PEOPLE.map(p=>'<option '+(p===(who==='전체'?ME.name:who)?'selected':'')+'>'+p+'</option>').join('')+'</select><button class="pbtn" id="wi_add">추가</button></div>';
  h+='<div class="sub" style="margin-top:6px">AI가 1시간마다 세 분의 어사이드 대화를 읽고 일 목록을 고쳐요. 2시간 동안 대화가 없으면 멈춤, 다시 대화하면 진행 중으로 바뀌어요. 틀렸을 때만 버튼을 눌러 주세요.</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-wi]').forEach(e=>e.onclick=()=>wiAct(+e.dataset.wi,e.dataset.act,who));
  $('#wi_add').onclick=async()=>{ const t=$('#wi_new').value.trim(); if(!t){ toast('한 줄 적어 주세요'); return; } const {error}=await sb.from('work_items').insert({owner:$('#wi_new_owner').value,title:t,source:'manual',last_activity:new Date().toISOString(),locked_by_human:true}); if(error){ if(await expired(error)) return; toast('추가하지 못했어요: '+error.message); return; } toast('일 목록에 추가했어요'); drawWork(who); };
}
async function wiAct(id,act,who){ let patch={updated_at:new Date().toISOString()};
  if(act==='done') patch={...patch,done:true,done_at:new Date().toISOString()};
  else if(act==='reopen') patch={...patch,done:false,done_at:null,last_activity:new Date().toISOString()};
  else if(act==='decided') patch={...patch,needs_boss:false};
  else if(act==='owner'){ const o=prompt('누구 일인가요? (대표님 / 철님 / 다원님)', (WI.find(w=>w.id===id)||{}).owner||''); if(!o) return; if(!PEOPLE.includes(o.trim())){ toast('대표님, 철님, 다원님 중에서 적어 주세요'); return; } patch={...patch,owner:o.trim(),owner_unsure:false,locked_by_human:true}; }
  const {error}=await sb.from('work_items').update(patch).eq('id',id); if(error){ if(await expired(error)) return; toast('바꾸지 못했어요: '+error.message); return; }
  toast({done:'완료로 옮겼어요',reopen:'다시 진행 중으로 옮겼어요',decided:'처리했어요',owner:'담당을 바꿨어요'}[act]); drawWork(who); }

async function setStatus(id,st){ const {error}=await sb.from('work_log').update({status:st,closed_date:today()}).eq('id',id); if(error){ if(await expired(error)) return; toast('바꾸지 못했어요: '+error.message);return;} const r=WL.find(x=>x.id==id); if(r){r.status=st;r.closed_date=today();} toast(st==='완료'?'끝낸 일로 옮겼어요':'해결됨으로 바꿨어요'); drawMy(); }
async function quickSave(){
  const text=$('#q_text').value.trim(); if(!text){toast('한 줄을 적어 주세요');return;}

function report(kind,who){
  const t=today(); const start=kind==='week'?weekStart(t):t.slice(0,8)+'01'; const inP=x=>x&&x>=start&&x<=t; const by=r=>who==='전체'||mine(r,who);

  const doneF=r=>r.people!==false&&((r.type==='한 일'&&inP(r.log_date))||(r.type==='할 일'&&r.status==='완료'&&inP(r.closed_date)));
  const done=WL.filter(r=>doneF(r)&&by(r)), left=WL.filter(r=>isOpenTodo(r)&&by(r)), blk=WL.filter(r=>isBlocked(r)&&by(r)), kn=WL.filter(r=>r.people&&r.type==='노하우'&&inP(r.log_date)&&(who==='전체'||r.who===who));

   +'<h3>끝낸 일</h3>'+li(done,r=>'<li>'+esc(r.content)+' <span class="sub">'+esc(r.owner||r.who||'')+'</span></li>')
   +'<h3>아직 남은 할 일</h3>'+li(left,r=>'<li>'+esc(r.content)+' <span class="sub">'+esc(r.owner||r.who)+' · '+r.log_date.slice(5)+' 생김</span></li>')
   +'<h3>막혀 있는 것</h3>'+li(blk,r=>'<li>'+esc(r.content)+(r.unblock?' <span class="sub">— 풀려면: '+esc(r.unblock)+'</span>':'')+'</li>')
   +'<h3>새 노하우</h3>'+li(kn,r=>'<li>'+esc(r.content)+'</li>')
   +'<h3>사람별 한 줄</h3><ul>'+per+'</ul></div>';
}
